description: >-
  Securian Financial Group is a Saint Paul, Minnesota-based mutual holding company
  offering life insurance, annuities, institutional retirement solutions, trust
  services, investment management and group workplace benefits to individuals,
  employers, financial institutions and institutional clients across the United
  States and Canada. Its operating companies include Minnesota Life Insurance
  Company, Securian Life Insurance Company, Securian Asset Management and Securian
  Canada. Securian does not run a public developer program: its integration
  surfaces are partner-facing and sales-gated. Securian Platform Connect exchanges
  benefits data with employer benefits-administration platforms using LIMRA LDEx
  standards (Evidence of Insurability and Benefits Enrollment Management) plus SSO,
  API notifications and file feeds, and FlexTech - launched March 2026 with Walnut -
  embeds payment protection into digital lending journeys through API-based
  integration. Neither publishes a machine-readable contract, developer portal or
  self-service onboarding.
